name: 构建并发布 Docker 镜像

# 推送到 dev / release 分支或打 tag 时自动构建镜像并推送到 GHCR。
# 前后端合并为单镜像，用户在 NAS 图形界面里拉一个镜像、建一个容器即可。
on:
  push:
    branches: [release, dev]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/napics

jobs:
  # 静态检查：揪出「用了但没导入」的名字。
  # 这类问题在 Python 3.14 上因注解延迟求值而不报错，但在容器里（3.13）
  # 会导入即崩。放在最前面，几秒就能跑完。
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 检查 undefined name
        run: |
          pip install pyflakes
          # 只把 undefined name 当作失败，未使用的导入等仅作提示
          FILES=$(find backend -name '*.py' \
            -not -path '*/__pycache__/*' \
            -not -path '*/_scripts/*' \
            -not -path '*/sandbox_real/*' \
            -not -name '_*.py')
          pyflakes $FILES > flakes.txt 2>&1 || true
          echo "--- 全部提示条数 ---"
          wc -l < flakes.txt
          echo "--- undefined name ---"
          if grep 'undefined name' flakes.txt; then
            echo "::error::存在 undefined name，容器内会导入即崩"
            exit 1
          fi
          echo "没有 undefined name"

  # 验证镜像能构建、能启动、前后端链路通，再推送
  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅本机，用于测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: napics:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器
        run: |
          mkdir -p /tmp/napics-media
          # 容器内固定监听 3032（Dockerfile 里 ENV PORT=3032），
          # 右边写 3000 会导致怎么等都连不上、150 秒超时。
          docker run -d --name napics-smoke \
            -p 3032:3032 \
            -v /tmp/napics-media:/media \
            napics:smoke

      - name: 等待就绪并验证前后端链路
        run: |
          # 注意 URL 不要带尾斜杠：/backend/ 会被 Next.js 308 重定向到 /backend，
          # curl 不加 -L 就会停在重定向响应上（响应体是 "/backend"）。
          # 这里同时去掉尾斜杠并加 -L 双重保险。
          echo "等待容器就绪（最多 150 秒）..."
          READY=0
          for i in $(seq 1 150); do
            if curl -fsSL http://127.0.0.1:3032/backend >/dev/null 2>&1; then
              echo "就绪，用时 ${i}s"
              READY=1
              break
            fi
            # 容器已经退出就不用再等，直接看日志
            if ! docker ps --filter name=napics-smoke --filter status=running -q | grep -q .; then
              echo "::error::容器已退出"
              echo "--- 退出码 ---"
              docker inspect napics-smoke --format '{{.State.ExitCode}}' || true
              echo "--- 容器日志 ---"
              docker logs napics-smoke || true
              exit 1
            fi
            # 每 20 秒打一次当前日志，方便看卡在哪一步
            if [ $((i % 20)) -eq 0 ]; then
              echo "--- 已等待 ${i}s，当前日志尾部 ---"
              docker logs --tail 25 napics-smoke 2>&1 || true
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::150 秒内未就绪"
            echo "--- 容器内监听端口 ---"
            docker exec napics-smoke sh -c "ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || echo '(无 ss/netstat)'" || true
            echo "--- 容器内直连后端 ---"
            docker exec napics-smoke curl -sS -m 5 http://127.0.0.1:8001/ || echo "后端无响应"
            echo "--- 容器内直连前端 ---"
            docker exec napics-smoke curl -sSL -m 5 -o /dev/null -w "前端 HTTP %{http_code}\n" http://127.0.0.1:3032/ || echo "前端无响应"
            echo "--- 容器内经前端转发 ---"
            docker exec napics-smoke curl -sSL -m 5 http://127.0.0.1:3032/backend || echo "转发无响应"
            exit 1
          fi

          echo "--- 后端根接口（经前端转发）---"
          BACKEND=$(curl -fsSL http://127.0.0.1:3032/backend)
          echo "$BACKEND"
          echo "$BACKEND" | grep -q "is running" || { echo "::error::后端响应异常"; exit 1; }

          echo "--- 前端页面 ---"
          curl -fsSL -o /dev/null -w "前端 HTTP %{http_code}\n" http://127.0.0.1:3032/ || exit 1

          echo "--- 插件接口（验证插件系统已加载）---"
          PROVIDERS=$(curl -fsSL http://127.0.0.1:3032/backend/api/providers) || {
            echo "::error::providers 接口异常"; exit 1; }
          echo "$PROVIDERS" | head -c 400; echo

          echo "--- 插件是否真正注册了搜索源 ---"
          # /api/providers 只反映插件守卫的放行结果，空壳插件同样会出现在里面。
          # 这里必须让容器内真实构建一次搜索源工厂，才能发现"装了插件但没注册 provider"。
          docker exec napics-smoke python - <<'PY'
          import sys
          sys.path.insert(0, "/app/backend")
          import os
          os.chdir("/app/backend")

          from plugin_manager import PluginManager
          from plugin_context import get_plugin_providers

          pm = PluginManager()
          from config_manager import ConfigManager
          installed = ConfigManager().config.installed_plugins
          print("installed_plugins:", installed)
          pm.load_installed_plugins(installed)

          providers = get_plugin_providers()
          print("registry 中的 provider:", sorted(providers))

          from bt_search_provider_factory import get_direct_bt_scraper_factories
          factories = get_direct_bt_scraper_factories()
          print("BT 工厂:", sorted(factories))

          search_like = [p for p, i in providers.items()
                         if i.get("type") in ("search", "scraper_search", "pan_search")]
          print("搜索类 provider 数:", len(search_like))
          print("BT 工厂源数:", len(factories))
          if not search_like or not factories:
              # 按 .gitignore 的约定，plugins/*/sources/ 由社区插件仓库独立分发，
              # 不随主镜像发布。此时搜索需要用户先在插件中心装搜索源。
              print("NO_SEARCH_SOURCE")
          else:
              print("OK: 搜索源注册正常")
          PY

          # 上面的检查结果只作提示：镜像默认不带第三方搜索源实现，
          # 但用户点搜索时必须能看到明确原因（而不是静默无反应），这一点在下面强制校验。

          echo "--- 点搜索时必须有明确反馈（不允许静默）---"
          # 允许两种结果：有源参与（status 事件），或没有源但明确告知原因（error=no_source）。
          # 唯一不允许的是"只回一个裸 done" —— 前端表现就是一闪而过、没有任何提示。
          SSE=$(curl -fsS --max-time 40 "http://127.0.0.1:3032/backend/api/search/stream?query=test" || true)
          echo "$SSE" | head -n 8
          if echo "$SSE" | grep -q '"type": *"status"'; then
            echo "OK: 有搜索源参与搜索"
          elif echo "$SSE" | grep -q 'no_source'; then
            echo "OK: 无搜索源，但后端明确回传了原因，前端会提示用户去装搜索源"
            echo "::warning::镜像内没有可用搜索源，用户需先在插件中心安装搜索源"
          else
            echo "::error::搜索既没有源参与、也没有回传原因 —— 前端会静默一闪而过"
            exit 1
          fi

          echo "--- 媒体库接口 ---"
          curl -fsSL -o /dev/null -w "library HTTP %{http_code}\n" http://127.0.0.1:3032/backend/library || exit 1

          echo "--- ffprobe 是否可用 ---"
          docker exec napics-smoke ffprobe -version | head -n 1

      - name: 输出容器日志
        if: always()
        run: docker logs napics-smoke

      - name: 清理容器
        if: always()
        run: docker rm -f napics-smoke || true

      # 导出 tar 供离线导入：国内访问 ghcr.io 常不通，
      # NAS 的 Docker 界面支持直接导入 tar 镜像文件
      - name: 导出镜像为 tar
        run: |
          docker save napics:smoke | gzip > napics-image.tar.gz
          ls -lh napics-image.tar.gz

      - name: 上传 tar 供下载
        uses: actions/upload-artifact@v4
        with:
          name: napics-docker-image-tar
          path: napics-image.tar.gz
          retention-days: 14
          compression-level: 0

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # secrets 不能直接用在 step 的 if 条件里，必须先转成 env
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # step 的 if 表达式读不到 step 级 env，判空用的变量必须挂在 job 上
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 是可选的：配置了 secrets 才登录并推送。
      # 国内 NAS 大多配了 Docker Hub 加速器，拉取比 ghcr.io 快很多。
      - name: 登录 Docker Hub（已配置 secrets 时）
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 组装镜像名列表
        id: images
        run: |
          # GHCR 要求镜像名全小写
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # 逐行输出，避免多行字符串带上前导空格导致镜像名解析错误
          {
            echo "list<<__EOF__"
            echo "${{ env.REGISTRY }}/${OWNER_LC}/napics"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "${DOCKERHUB_USERNAME}/napics"
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "Docker Hub 已配置，将同时推送到 ${DOCKERHUB_USERNAME}/napics"
          else
            echo "未配置 Docker Hub secrets，仅推送 GHCR"
          fi

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 暂时只构建 amd64：飞牛/群晖等 x86 NAS 都是 amd64，
          # arm64 需要 QEMU 交叉编译，慢且容易引入额外问题。
          # 等 amd64 稳定后再加回 linux/arm64。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同步 Docker Hub 仓库页面的说明（面向拉镜像的人，内容见 docker/README.dockerhub.md）。
      #
      # 注意：这一步必须用 Docker Hub 的账号密码，不能用 access token。
      # 改仓库描述走的是 PATCH /v2/repositories/...，该接口不接受 PAT，会直接 403。
      # 密码放进 secrets 属于安全降级，而且账号开了 2FA 时密码登录也会失败，
      # 所以默认不启用：没配 DOCKERHUB_PASSWORD 就跳过，描述改为手动粘贴一次
      # （描述几乎不变，不值得为它把密码交给 CI）。
      - name: 同步 Docker Hub 仓库说明（需配置 DOCKERHUB_PASSWORD）
        if: github.ref == 'refs/heads/release' && env.DOCKERHUB_PASSWORD != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/napics
          readme-filepath: ./docker/README.dockerhub.md
          short-description: "智能媒体资产管理系统：扫描、刮削、整理、质量分析与升级维护，单容器单端口部署"
