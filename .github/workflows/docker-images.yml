name: 构建并发布 Docker 镜像

# 推送到 dev / release 分支或打 tag 时自动构建镜像并推送到 GHCR。
# 前后端合并为单镜像，用户在 NAS 图形界面里拉一个镜像、建一个容器即可。
on:
  push:
    branches: [release, dev]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/napics

jobs:
  # 先在 CI 里验证镜像能构建、能启动、前后端链路通，再推送
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅本机，用于测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: napics:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器
        run: |
          mkdir -p /tmp/napics-media
          docker run -d --name napics-smoke \
            -p 3032:3000 \
            -v /tmp/napics-media:/media \
            napics:smoke

      - name: 等待就绪并验证前后端链路
        run: |
          echo "等待容器就绪（最多 150 秒）..."
          READY=0
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:3032/backend/ >/dev/null 2>&1; then
              echo "就绪，用时 ${i}s"
              READY=1
              break
            fi
            # 容器已经退出就不用再等，直接看日志
            if ! docker ps --filter name=napics-smoke --filter status=running -q | grep -q .; then
              echo "::error::容器已退出"
              echo "--- 退出码 ---"
              docker inspect napics-smoke --format '{{.State.ExitCode}}' || true
              echo "--- 容器日志 ---"
              docker logs napics-smoke || true
              exit 1
            fi
            # 每 20 秒打一次当前日志，方便看卡在哪一步
            if [ $((i % 20)) -eq 0 ]; then
              echo "--- 已等待 ${i}s，当前日志尾部 ---"
              docker logs --tail 25 napics-smoke 2>&1 || true
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::150 秒内未就绪"
            echo "--- 容器内监听端口 ---"
            docker exec napics-smoke sh -c "ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || echo '(无 ss/netstat)'" || true
            echo "--- 容器内直连后端 ---"
            docker exec napics-smoke curl -sS -m 5 http://127.0.0.1:8001/ || echo "后端无响应"
            echo "--- 容器内直连前端 ---"
            docker exec napics-smoke curl -sS -m 5 -o /dev/null -w "前端 HTTP %{http_code}\n" http://127.0.0.1:3000/ || echo "前端无响应"
            exit 1
          fi

          echo "--- 后端根接口（经前端转发）---"
          BACKEND=$(curl -fsS http://127.0.0.1:3032/backend/)
          echo "$BACKEND"
          echo "$BACKEND" | grep -q "is running" || { echo "::error::后端响应异常"; exit 1; }

          echo "--- 前端页面 ---"
          curl -fsS -o /dev/null -w "前端 HTTP %{http_code}\n" http://127.0.0.1:3032/ || exit 1

          echo "--- 插件接口（验证插件系统已加载）---"
          curl -fsS http://127.0.0.1:3032/backend/api/providers >/dev/null \
            && echo "providers 接口正常" || echo "::warning::providers 接口异常"

          echo "--- ffprobe 是否可用 ---"
          docker exec napics-smoke ffprobe -version | head -n 1

      - name: 输出容器日志
        if: always()
        run: docker logs napics-smoke

      - name: 清理容器
        if: always()
        run: docker rm -f napics-smoke || true

      # 导出 tar 供离线导入：国内访问 ghcr.io 常不通，
      # NAS 的 Docker 界面支持直接导入 tar 镜像文件
      - name: 导出镜像为 tar
        run: |
          docker save napics:smoke | gzip > napics-image.tar.gz
          ls -lh napics-image.tar.gz

      - name: 上传 tar 供下载
        uses: actions/upload-artifact@v4
        with:
          name: napics-docker-image-tar
          path: napics-image.tar.gz
          retention-days: 14
          compression-level: 0

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 暂时只构建 amd64：飞牛/群晖等 x86 NAS 都是 amd64，
          # arm64 需要 QEMU 交叉编译，慢且容易引入额外问题。
          # 等 amd64 稳定后再加回 linux/arm64。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
