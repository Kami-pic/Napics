# 前后端已合并为单镜像，只需一个服务。
# 也可以完全不用这个文件，直接在 NAS 的 Docker 图形界面里建容器（见 README）。
services:
  napics:
    image: ghcr.io/kami-pic/napics:${NAPICS_TAG:-latest}
    # 需要改代码时改用本地构建：注释掉上面的 image，取消下面两行注释
    # build:
    #   context: .
    container_name: napics
    ports:
      # 只需要这一个端口。后端在容器内监听 127.0.0.1，不对外暴露
      - "${FRONTEND_PORT:-3032}:3000"
    volumes:
      # 配置与媒体库数据
      - napics-data:/app/data
      # 媒体库：容器内外使用同一个路径，这样设置页里直接填真实路径即可，
      # 不需要在两套路径之间做心算转换，下载器返回的路径也能直接对上。
      - ${MEDIA_PATH:?请在 .env 中设置 MEDIA_PATH}:${MEDIA_PATH}
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # 显式指定 DNS：部分 NAS 的 Docker 默认网络拿不到可用的 DNS，
    # 表现为容器内所有域名解析失败（Temporary failure in name resolution），
    # 刮削 / 搜索 / 发现页 / 插件源全部不可用。
    dns:
      - ${DNS1:-223.5.5.5}
      - ${DNS2:-119.29.29.29}
    # 容器内访问宿主机上的 qBittorrent / OpenList 时填 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  napics-data:
