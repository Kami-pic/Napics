services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: napics-backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      # 配置与数据持久化
      - napics-data:/app/data
      # 媒体库挂载：MEDIA_PATH 为宿主机媒体目录，容器内路径为 /media
      - ${MEDIA_PATH:-./_media}:/media
    environment:
      - NAPICS_DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Shanghai}
    # 让容器内可用 host.docker.internal 访问宿主机上的 qBittorrent / OpenList / 代理
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建时注入后端地址（必须是用户浏览器能访问到的地址）
        # NAS 部署改成 http://<NAS-IP>:8001，在 .env 里设置 NAPICS_API_URL
        - NEXT_PUBLIC_API_URL=${NAPICS_API_URL:-http://localhost:8001}
    container_name: napics-frontend
    ports:
      - "${FRONTEND_PORT:-3032}:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  napics-data:
