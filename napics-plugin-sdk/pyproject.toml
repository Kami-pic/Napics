[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "napics-plugin-sdk"
version = "0.1.0"
description = "Napics 插件开发 SDK — 提供 Provider 协议、数据模型和运行时上下文"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "napics", email = "napics@example.com" },
]
keywords = ["napics", "plugin", "media", "nas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/nicq/napics"
Documentation = "https://github.com/nicq/napics/blob/main/backend/plugins/PLUGIN_DEV_GUIDE.md"

[tool.hatch.build.targets.wheel]
packages = ["napics_sdk"]
